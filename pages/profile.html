<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · HerFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%E2%9C%A6%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/profile.css">
</head>
<body>

<div id="topbarRoot"></div>

<div class="app-shell">
  <div id="sidebarRoot"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Profile</h1>
        <p class="page-subtitle">This is how you show up across HerFlow.</p>
      </div>
    </div>

    <div class="profile-layout">
      <div class="card profile-card">
        <div class="profile-avatar-wrap">
          <img id="profileAvatarPreview" src="../assets/images/default-avatar.png" alt="Your profile photo">
          <label for="avatarUpload" class="avatar-upload-btn" title="Change photo">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input type="file" id="avatarUpload" accept="image/*" hidden>
        </div>
        <h2 id="profileDisplayName">Aiman</h2>
        <p class="text-soft" id="profileDisplayUsername">@aiman.codes</p>
        <p class="profile-occupation" id="profileDisplayOccupation">Frontend Developer & Graphic Designer</p>
        <p class="profile-bio" id="profileDisplayBio"></p>

        <div class="profile-stats">
          <div><strong id="statTasks">0</strong><span>Tasks</span></div>
          <div><strong id="statProjects">0</strong><span>Projects</span></div>
          <div><strong id="statCompleted">0</strong><span>Completed</span></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:18px;">Edit Profile</h3>
        <form id="profileForm">
          <div class="form-group">
            <label for="pfName">Full name</label>
            <input type="text" id="pfName" required>
          </div>
          <div class="form-group">
            <label for="pfUsername">Username</label>
            <input type="text" id="pfUsername" required>
          </div>
          <div class="form-group">
            <label for="pfOccupation">Occupation</label>
            <input type="text" id="pfOccupation">
          </div>
          <div class="form-group">
            <label for="pfBio">Bio</label>
            <textarea id="pfBio" placeholder="A little about you"></textarea>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
        </form>
      </div>
    </div>
  </main>
</div>

<div id="bottomNavRoot"></div>

<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
